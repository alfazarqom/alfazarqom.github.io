<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f5">
  <meta name="description" content="Kelola produk Divoom dengan tampilan sederhana.">
  <title>Divoom Product Manager — Simple</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #202923;
      background: #eef1ed;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      background: #f8faf8;
      box-shadow: 0 0 30px #17251a12;
      padding-bottom: 28px;
    }
    header {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px; background: #fff; border-bottom: 1px solid #e5eae5;
    }
    h1 { margin: 0; font-size: 18px; }
    .subtitle { margin: 4px 0 0; color: #748078; font-size: 12px; }
    main { padding: 16px; }
    .toolbar { display: grid; gap: 9px; margin: 16px 0; }
    input, select, textarea {
      width: 100%; min-height: 42px; padding: 10px 11px;
      border: 1px solid #dce4dc; border-radius: 9px; background: white;
      color: #202923; font-size: 13px;
    }
    textarea { min-height: 90px; resize: vertical; }
    button {
      min-height: 40px; padding: 9px 13px; border: 1px solid #dce4dc;
      border-radius: 9px; background: white; color: #26352a;
      font-size: 13px; font-weight: 700;
    }
    button.primary { background: #167443; border-color: #167443; color: white; }
    button.danger { color: #b42318; border-color: #f0c9c5; }
    button:disabled { opacity: .55; cursor: wait; }
    .list-heading {
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; margin: 18px 0 10px;
    }
    .list-heading h2 { margin: 0; font-size: 15px; }
    .count { color: #78837b; font-size: 11px; }
    .product-list { display: grid; gap: 10px; }
    .product {
      display: grid; grid-template-columns: 76px minmax(0,1fr);
      gap: 11px; padding: 11px; background: white;
      border: 1px solid #e3e9e3; border-radius: 12px;
    }
    .product img, .no-image {
      width: 76px; height: 76px; border-radius: 9px;
      object-fit: cover; background: #f0f3f0;
    }
    .no-image { display: grid; place-items: center; color: #9aa49c; font-size: 22px; }
    .product h3 { margin: 2px 0 5px; font-size: 13px; line-height: 1.4; }
    .meta { margin: 0 0 5px; color: #748078; font-size: 10px; overflow-wrap: anywhere; }
    .price { margin: 0 0 8px; font-size: 12px; font-weight: 700; }
    .actions { display: flex; gap: 6px; }
    .actions button { min-height: 30px; padding: 5px 9px; font-size: 11px; }
    .message {
      padding: 18px; border: 1px dashed #d6dfd6; border-radius: 10px;
      background: white; color: #758078; text-align: center; font-size: 13px;
    }
    .error { color: #a32920; background: #fff1ef; border: 1px solid #f4d0cb; }
    .overlay {
      position: fixed; inset: 0; z-index: 5; display: none;
      align-items: end; justify-content: center; background: #14201980;
    }
    .overlay.open { display: flex; }
    .dialog {
      width: 100%; max-width: 480px; max-height: 94vh; overflow: auto;
      padding: 16px; border-radius: 16px 16px 0 0; background: #f8faf8;
    }
    .dialog-head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 14px;
    }
    .dialog-head h2 { margin: 0; font-size: 16px; }
    .form { display: grid; gap: 11px; }
    .field { display: grid; gap: 5px; }
    .field label { font-size: 11px; font-weight: 700; color: #536057; }
    .field small { color: #879188; font-size: 10px; }
    .form-actions { display: flex; gap: 8px; padding-top: 5px; }
    .form-actions button { flex: 1; }
    .status { min-height: 18px; margin: 10px 0 0; color: #68756c; font-size: 11px; }
    @media (min-width: 481px) {
      .app { min-height: 100vh; }
      .overlay { align-items: center; padding: 16px; }
      .dialog { border-radius: 14px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Divoom Products</h1>
        <p class="subtitle">Kelola katalog produk dengan mudah</p>
      </div>
      <button id="reloadButton" type="button" aria-label="Muat ulang">↻</button>
    </header>

    <main>
      <button class="primary" id="addButton" type="button" style="width:100%">+ Tambah produk</button>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Cari nama, ID grup, atau brand…">
        <select id="categoryFilter">
          <option value="">Semua kategori</option>
        </select>
      </div>

      <div class="list-heading">
        <h2>Daftar produk</h2>
        <span class="count" id="productCount">Memuat…</span>
      </div>
      <section class="product-list" id="productList" aria-live="polite">
        <div class="message">Memuat produk…</div>
      </section>
      <p class="status" id="pageStatus" role="status"></p>
    </main>
  </div>

  <div class="overlay" id="formOverlay">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="formTitle">
      <div class="dialog-head">
        <h2 id="formTitle">Tambah produk</h2>
        <button id="closeButton" type="button" aria-label="Tutup">×</button>
      </div>
      <form class="form" id="productForm">
        <input type="hidden" name="id">
        <div class="field">
          <label for="item_group_id">Item Group ID *</label>
          <input id="item_group_id" name="item_group_id" required>
        </div>
        <div class="field">
          <label for="title">Nama produk *</label>
          <input id="title" name="title" required>
        </div>
        <div class="field">
          <label for="product_type">Kategori (product_type)</label>
          <input id="product_type" name="product_type" list="categoryOptions" placeholder="Contoh: Speakers">
          <datalist id="categoryOptions"></datalist>
        </div>
        <div class="field">
          <label for="brand">Brand</label>
          <input id="brand" name="brand" value="Divoom">
        </div>
        <div class="field">
          <label for="price">Harga *</label>
          <input id="price" name="price" type="number" min="0" step="1" required>
        </div>
        <div class="field">
          <label for="sale_price">Harga diskon</label>
          <input id="sale_price" name="sale_price" type="number" min="0" step="1">
        </div>
        <div class="field">
          <label for="availability">Availability</label>
          <input id="availability" name="availability" placeholder="in stock / out of stock">
        </div>
        <div class="field">
          <label for="color">Warna</label>
          <input id="color" name="color">
        </div>
        <div class="field">
          <label for="size">Ukuran</label>
          <input id="size" name="size">
        </div>
        <div class="field">
          <label for="description">Deskripsi singkat</label>
          <textarea id="description" name="description"></textarea>
        </div>
        <div class="field">
          <label for="rich_text_description">Deskripsi lengkap</label>
          <textarea id="rich_text_description" name="rich_text_description"></textarea>
          <small>Isi teks atau HTML sesuai kebutuhan.</small>
        </div>
        <div class="field">
          <label for="imageFile">Gambar utama</label>
          <input id="imageFile" name="imageFile" type="file" accept="image/jpeg,image/png,image/webp">
          <small id="imageHelp">Gambar utama diperlukan saat menambah produk. Maksimal 5 MB.</small>
        </div>
        <div class="form-actions">
          <button id="cancelButton" type="button">Batal</button>
          <button class="primary" id="saveButton" type="submit">Simpan</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      // Koneksi API: gunakan Edge Function yang sama dengan crud-divoom.html.
      const SUPABASE_URL = "https://mvwflakurihhakdrlteg.supabase.co";
      const API_URL = SUPABASE_URL + "/functions/v1/crud-divoom";

      // Hanya field ini yang dikirim sebagai data produk ke backend.
      const PRODUCT_FIELDS = [
        "item_group_id", "title", "product_type", "brand", "price",
        "sale_price", "availability", "color", "size",
        "description", "rich_text_description"
      ];

      const state = { products: [], editingId: null };
      const $ = (selector) => document.querySelector(selector);

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[char]));
      }

      function formatPrice(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) return "Harga belum tersedia";
        return new Intl.NumberFormat("id-ID", {
          style: "currency", currency: "IDR", maximumFractionDigits: 0
        }).format(amount);
      }

      async function request(path = "", options = {}) {
        const response = await fetch(API_URL + path, options);
        let result;
        try { result = await response.json(); }
        catch { throw new Error("Respons server tidak dapat dibaca."); }

        if (!response.ok || result.success === false) {
          throw new Error(result.message || "Permintaan gagal.");
        }
        return result;
      }

      async function loadProducts() {
        $("#productList").innerHTML = '<div class="message">Memuat produk…</div>';
        $("#productCount").textContent = "Memuat…";
        try {
          const result = await request();
          state.products = Array.isArray(result.data) ? result.data : [];
          renderProducts();
          $("#pageStatus").textContent = "";
        } catch (error) {
          $("#productList").innerHTML =
            '<div class="message error">' + escapeHTML(error.message) + '</div>';
          $("#productCount").textContent = "Gagal memuat";
          $("#pageStatus").textContent = "Periksa koneksi, lalu tekan tombol muat ulang.";
        }
      }

      function renderCategoryOptions() {
        const categories = [...new Set(
          state.products.map((product) => String(product.product_type || "").trim()).filter(Boolean)
        )].sort((a, b) => a.localeCompare(b));

        const current = $("#categoryFilter").value;
        $("#categoryFilter").innerHTML =
          '<option value="">Semua kategori</option>' +
          categories.map((category) =>
            '<option value="' + escapeHTML(category) + '">' + escapeHTML(category) + '</option>'
          ).join("");
        $("#categoryFilter").value = categories.includes(current) ? current : "";

        $("#categoryOptions").innerHTML = categories.map((category) =>
          '<option value="' + escapeHTML(category) + '"></option>'
        ).join("");
      }

      function renderProducts() {
        renderCategoryOptions();

        const keyword = $("#searchInput").value.trim().toLowerCase();
        const category = $("#categoryFilter").value;
        const filtered = state.products.filter((product) => {
          const searchable = [
            product.title, product.item_group_id, product.brand, product.product_type
          ].join(" ").toLowerCase();
          return searchable.includes(keyword) &&
            (!category || String(product.product_type || "").trim() === category);
        });

        $("#productCount").textContent = filtered.length + " dari " + state.products.length + " produk";

        if (!filtered.length) {
          $("#productList").innerHTML =
            '<div class="message">Tidak ada produk yang cocok. Coba kata kunci atau kategori lain.</div>';
          return;
        }

        $("#productList").innerHTML = filtered.map((product) => {
          const image = product.image_link
            ? '<img src="' + escapeHTML(product.image_link) + '" alt="' + escapeHTML(product.title) + '" loading="lazy">'
            : '<div class="no-image">D</div>';

          return '<article class="product">' +
            image +
            '<div><h3>' + escapeHTML(product.title || "Tanpa nama") + '</h3>' +
            '<p class="meta">ID grup: ' + escapeHTML(product.item_group_id || "—") + '</p>' +
            '<p class="meta">' + escapeHTML(product.product_type || "Tanpa kategori") +
            ' · ' + escapeHTML(product.brand || "Tanpa brand") + '</p>' +
            '<p class="price">' + formatPrice(product.sale_price || product.price) + '</p>' +
            '<div class="actions">' +
            '<button type="button" data-edit="' + escapeHTML(product.id) + '">Edit</button>' +
            '<button class="danger" type="button" data-delete="' + escapeHTML(product.id) + '">Hapus</button>' +
            '</div></div></article>';
        }).join("");

        $("#productList").querySelectorAll("[data-edit]").forEach((button) => {
          button.addEventListener("click", () => {
            const product = state.products.find((item) => String(item.id) === button.dataset.edit);
            if (product) openForm(product);
          });
        });

        $("#productList").querySelectorAll("[data-delete]").forEach((button) => {
          button.addEventListener("click", () => deleteProduct(button.dataset.delete));
        });
      }

      function openForm(product = null) {
        state.editingId = product ? product.id : null;
        $("#productTitle");
        $("#formTitle").textContent = product ? "Edit produk" : "Tambah produk";
        $("#productForm").reset();
        $("#productForm").elements.id.value = product ? product.id : "";
        PRODUCT_FIELDS.forEach((field) => {
          $("#productForm").elements[field].value = product?.[field] ?? "";
        });
        $("#productForm").elements.brand.value ||= "Divoom";
        $("#item_group_id").readOnly = Boolean(product);
        $("#imageFile").required = !product;
        $("#imageHelp").textContent = product
          ? "Pilih file hanya jika ingin mengganti gambar utama. Maksimal 5 MB."
          : "Gambar utama diperlukan saat menambah produk. Maksimal 5 MB.";
        $("#saveButton").disabled = false;
        $("#saveButton").textContent = "Simpan";
        $("#formOverlay").classList.add("open");
      }

      function closeForm() {
        $("#formOverlay").classList.remove("open");
        $("#productForm").reset();
        state.editingId = null;
      }

      function collectProductData(form) {
        const data = {};
        PRODUCT_FIELDS.forEach((field) => {
          const value = form.elements[field].value.trim();
          data[field] = value === "" ? null :
            (["price", "sale_price"].includes(field) ? Number(value) : value);
        });
        return data;
      }

      async function saveProduct(event) {
        event.preventDefault();
        const form = event.currentTarget;
        const image = $("#imageFile").files[0];
        const isEditing = Boolean(state.editingId);

        if (!isEditing && !image) {
          $("#pageStatus").textContent = "Pilih gambar utama untuk produk baru.";
          return;
        }
        if (image && image.size > 5 * 1024 * 1024) {
          $("#pageStatus").textContent = "Ukuran gambar maksimal 5 MB.";
          return;
        }

        const button = $("#saveButton");
        button.disabled = true;
        button.textContent = "Menyimpan…";

        try {
          const body = new FormData();
          body.append("product", JSON.stringify(collectProductData(form)));

          if (isEditing) {
            body.append("id", String(state.editingId));
            if (image) body.append("image_link", image);
            await request("", { method: "PATCH", body });
          } else {
            body.append("image_link", image);
            await request("", { method: "POST", body });
          }

          closeForm();
          $("#pageStatus").textContent = "Produk berhasil disimpan.";
          await loadProducts();
        } catch (error) {
          $("#pageStatus").textContent = "Gagal menyimpan: " + error.message;
          button.disabled = false;
          button.textContent = "Simpan";
        }
      }

      async function deleteProduct(id) {
        const product = state.products.find((item) => String(item.id) === String(id));
        const name = product?.title || "produk ini";
        if (!window.confirm('Hapus "' + name + '"? Tindakan ini tidak dapat dibatalkan.')) return;

        try {
          await request("?id=" + encodeURIComponent(id), { method: "DELETE" });
          $("#pageStatus").textContent = "Produk berhasil dihapus.";
          await loadProducts();
        } catch (error) {
          $("#pageStatus").textContent = "Gagal menghapus: " + error.message;
        }
      }

      $("#addButton").addEventListener("click", () => openForm());
      $("#reloadButton").addEventListener("click", loadProducts);
      $("#searchInput").addEventListener("input", renderProducts);
      $("#categoryFilter").addEventListener("change", renderProducts);
      $("#productForm").addEventListener("submit", saveProduct);
      $("#closeButton").addEventListener("click", closeForm);
      $("#cancelButton").addEventListener("click", closeForm);
      $("#formOverlay").addEventListener("click", (event) => {
        if (event.target === $("#formOverlay")) closeForm();
      });

      loadProducts();
    })();
  </script>
</body>
</html>
