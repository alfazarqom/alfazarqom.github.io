<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f6">
<meta name="description" content="Divoom Product Manager — kelola produk dan varian.">
<title>Divoom Product Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{font-family:"DM Sans",sans-serif;color:#17211b;background:#f7f8f6;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#17211b;--muted:#778078;--line:#e5e9e4;--green:#16734a;--green-dark:#105638;--paper:#fff;--soft:#f0f4f0;--red:#b64b43;--shadow:0 18px 55px rgba(20,42,29,.12}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{background:#f7f8f6}button,input,select,textarea{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #269b69;outline-offset:2px}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:36px;height:36px;border-radius:12px;background:#e7f2eb;color:var(--green);display:grid;place-items:center;font-weight:800;font-family:Manrope;font-size:18px}.brand strong{display:block;font:800 14px Manrope;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.top-actions{display:flex;gap:8px}.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:17px}.layout{width:100%;max-width:1440px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);flex:1}.sidebar{padding:26px 14px;border-right:1px solid var(--line)}.nav-label{padding:0 12px 10px;color:#98a099;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.nav-btn{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border:0;border-radius:11px;background:transparent;color:#69746c;text-align:left;font-size:12px;font-weight:600;margin:3px 0}.nav-btn span:first-child{width:20px;text-align:center;font-size:16px}.nav-btn.active,.nav-btn:hover{background:#eaf3ed;color:var(--green)}main{min-width:0;padding:30px clamp(18px,3vw,42px) 100px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{margin:0 0 7px;color:var(--green);font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}.page-head h1{font:800 clamp(24px,3vw,34px) Manrope;margin:0;letter-spacing:-1.2px}.sub{margin:8px 0 0;color:var(--muted);font-size:12px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:11px;font-weight:700}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.danger{color:var(--red);border-color:#f0d8d5;background:#fff}.btn.small{min-height:34px;padding:0 10px;font-size:10px;border-radius:9px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:24px}.stat{padding:17px;background:#fff;border:1px solid var(--line);border-radius:15px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;font-weight:600}.stat-icon{font-size:17px}.stat-value{margin-top:14px;font:800 25px Manrope;letter-spacing:-.8px}.stat-note{margin-top:3px;color:#9aa29b;font-size:9px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.toolbar{display:flex;align-items:center;gap:9px;padding:15px;border-bottom:1px solid var(--line)}.search{flex:1;min-width:100px;position:relative}.search input{width:100%;height:40px;padding:0 13px 0 36px;border:1px solid var(--line);border-radius:10px;background:#fafbf9;font-size:11px}.search:before{content:"⌕";position:absolute;left:13px;top:7px;font-size:20px;color:#879188}.toolbar select{height:40px;padding:0 28px 0 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#536057;font-size:10px}.count{padding:12px 16px;color:var(--muted);font-size:10px;border-bottom:1px solid var(--line)}.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:15px}.product-card{min-width:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff;cursor:pointer;transition:transform .18s,border-color .18s}.product-card:hover{transform:translateY(-2px);border-color:#b9d4c2}.product-image{position:relative;aspect-ratio:1.2;background:#f0f3ef;display:grid;place-items:center;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover}.placeholder{color:#9ba99e;font:italic 32px Georgia}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:20px;background:#edf5ef;color:var(--green);font-size:9px;font-weight:700}.product-image .pill{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.94)}.product-info{padding:12px}.product-info .group{color:#98a099;font-size:9px;overflow-wrap:anywhere}.product-info h3{margin:6px 0 8px;font:700 12px Manrope;line-height:1.45;min-height:35px}.price{font-size:12px;font-weight:800}.variant-count{margin-top:8px;color:var(--muted);font-size:9px}.empty,.loading{padding:55px 20px;text-align:center;color:var(--muted);font-size:12px}.empty b{display:block;color:var(--ink);font:700 15px Manrope;margin-bottom:7px}.error{color:var(--red);padding:20px;font-size:11px}.mobile-nav{display:none}.overlay{position:fixed;inset:0;background:rgba(12,24,17,.48);z-index:30;display:none;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.dialog{width:min(720px,100%);max-height:min(90vh,900px);overflow:auto;background:#fff;border-radius:18px;box-shadow:var(--shadow)}.dialog.narrow{width:min(480px,100%)}.dialog-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:17px 20px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}.dialog-head h2{margin:0;font:800 17px Manrope}.close{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}.dialog-body{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;min-width:0}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:700;color:#59645c}.field input,.field select,.field textarea{width:100%;min-height:42px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#fcfdfb;font-size:11px;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.field small{color:#929b94;font-size:9px}.filebox{padding:14px;border:1px dashed #b8c9bc;border-radius:12px;background:#f8fbf8}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.preview img{width:65px;height:65px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}.detail-hero{display:grid;grid-template-columns:190px 1fr;gap:18px}.detail-main-img{width:100%;aspect-ratio:1;background:#f0f3ef;border-radius:13px;object-fit:cover}.detail-title{font:800 20px Manrope;margin:2px 0 8px}.detail-meta{font-size:10px;color:var(--muted);line-height:1.8}.variant-list{display:grid;gap:9px;margin-top:20px}.variant-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}.variant-data{min-width:0}.variant-data b{display:block;font-size:11px}.variant-data small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.variant-actions{display:flex;gap:6px;flex:none}.toast{position:fixed;z-index:60;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 16px;border-radius:12px;background:#173c2a;color:#fff;font-size:11px;box-shadow:var(--shadow);transition:.2s;max-width:calc(100% - 30px)}.toast.show{opacity:1;transform:translate(-50%,0)}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #d9e5dc;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.muted{color:var(--muted)}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:190px minmax(0,1fr)}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.topbar{height:60px;padding:0 15px}.brand-mark{width:33px;height:33px}.layout{display:block}.sidebar{display:none}main{padding:22px 14px 100px}.page-head{align-items:flex-start;flex-direction:column;margin-bottom:18px}.page-head .btn{width:100%}.stats{gap:9px;margin-bottom:16px}.stat{padding:13px;border-radius:13px}.stat-value{font-size:22px;margin-top:11px}.stat-note{font-size:8px}.toolbar{padding:11px;flex-wrap:wrap}.search{flex-basis:100%}.toolbar select{flex:1;min-width:0}.product-grid{gap:9px;padding:10px}.product-info{padding:10px}.product-info h3{font-size:11px;min-height:32px}.product-image{aspect-ratio:1}.mobile-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);backdrop-filter:blur(14px)}.mobile-nav button{border:0;background:transparent;color:#8b958d;display:grid;justify-items:center;gap:3px;padding:5px;font-size:9px}.mobile-nav button span{font-size:18px}.mobile-nav button.active{color:var(--green);font-weight:800}.overlay{align-items:flex-end;padding:0}.dialog,.dialog.narrow{width:100%;max-height:94dvh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}.dialog-head{padding:15px 16px}.dialog-body{padding:15px}.form-grid{grid-template-columns:1fr;gap:11px}.field.full{grid-column:auto}.dialog-foot{padding:12px 15px}.dialog-foot .btn{flex:1}.detail-hero{grid-template-columns:100px 1fr;gap:12px}.detail-title{font-size:16px}.variant-row{align-items:flex-start;flex-direction:column}.variant-actions{width:100%}.variant-actions .btn{flex:1}.toast{bottom:85px}.count{padding:10px 12px}}
@media(max-width:360px){.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.product-info{padding:8px}.stat-value{font-size:19px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">D</div><div><strong>Divoom Manager</strong><small>PRODUCT WORKSPACE</small></div></div>
  <div class="top-actions"><button class="icon-btn" id="refreshBtn" aria-label="Muat ulang">↻</button></div>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="nav-label">Workspace</div>
  <button class="nav-btn active" data-page="dashboard"><span>▦</span>Dasbor</button>
  <button class="nav-btn" data-page="products"><span>▤</span>Produk</button>
  <div class="nav-label" style="margin-top:25px">Koneksi</div>
  <div style="padding:0 12px;color:#879188;font-size:10px;line-height:1.8">Supabase Edge Function<br><b style="color:#16734a">crud-divoom · v2</b></div>
</aside>
<main id="main">
  <div class="loading"><span class="spinner"></span> Menghubungkan ke katalog produk…</div>
</main>
</div>
<nav class="mobile-nav">
  <button class="active" data-page="dashboard"><span>▦</span>Dasbor</button>
  <button data-page="products"><span>▤</span>Produk</button>
  <button id="mobileAdd"><span>＋</span>Tambah</button>
</nav>
</div>
<div class="overlay" id="modalOverlay" role="dialog" aria-modal="true"><section class="dialog" id="dialog"></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
"use strict";
const SUPABASE_URL="https://mvwflakurihhakdrlteg.supabase.co";
const API_URL=SUPABASE_URL+"/functions/v1/crud-divoom";
const PRODUCT_FIELDS=["item_group_id","title","description","rich_text_description","availability","condition","price","sale_price","link","brand","google_product_category","product_type","color","size","material","pattern","gender","age_group","additional_variant_attribute"];
const state={records:[],page:"dashboard",query:"",availability:"",brand:"",sort:"name",activeGroup:null,loading:false};
const $=(s,root=document)=>root.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>{const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n):"—"};
const groupRecords=()=>{const m=new Map();state.records.forEach(p=>{const k=String(p.item_group_id??"");if(!m.has(k))m.set(k,[]);m.get(k).push(p)});return [...m.entries()].map(([key,items])=>({key,items,first:items[0]}))};
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2800)}
async function api(path="",options={}){const res=await fetch(API_URL+path,options);let body;try{body=await res.json()}catch{body={message:"Respons server tidak valid."}}if(!res.ok||body.success===false){throw new Error(body.message||("Permintaan gagal ("+res.status+")"))}return body}
async function load(){state.loading=true;render();try{const result=await api();state.records=Array.isArray(result.data)?result.data:[];state.loading=false;render()}catch(e){state.loading=false;$("#main").innerHTML='<div class="error">Gagal memuat data: '+esc(e.message)+'<br><br><button class="btn" id="retry">Coba lagi</button></div>';$("#retry").onclick=load}}
function isAvailable(p){const v=String(p.availability??"").toLowerCase();return ["in stock","available","tersedia","in_stock"].includes(v)}
function groupPrice(g){const nums=g.items.map(p=>Number(p.sale_price||p.price)).filter(Number.isFinite);if(!nums.length)return "Harga belum tersedia";const min=Math.min(...nums),max=Math.max(...nums);return min===max?money(min):money(min)+" – "+money(max)}
function filteredGroups(){let a=groupRecords().filter(g=>{const p=g.first,q=state.query.toLowerCase();return (!q||(String(p.title||"").toLowerCase().includes(q)||g.key.toLowerCase().includes(q)||g.items.some(x=>String(x.brand||"").toLowerCase().includes(q))))&&(!state.availability||g.items.some(x=>String(x.availability||"")===state.availability))&&(!state.brand||g.items.some(x=>x.brand===state.brand))});a.sort((x,y)=>state.sort==="name"?String(x.first.title||"").localeCompare(String(y.first.title||"")):state.sort==="price"?Math.min(...x.items.map(p=>Number(p.price)||0))-Math.min(...y.items.map(p=>Number(p.price)||0)):0);return a}
function navActive(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function render(){navActive();if(state.page==="dashboard")renderDashboard();else renderProducts()}
function renderDashboard(){const groups=groupRecords(),variants=state.records.length,available=state.records.filter(isAvailable).length;$("#main").innerHTML=`
<div class="page-head"><div><p class="eyebrow">Ringkasan katalog</p><h1>Dasbor</h1><p class="sub">Pantau produk dan varian Divoom dalam satu tempat.</p></div><button class="btn primary" id="addProduct">＋ Tambah produk</button></div>
<section class="stats">
<div class="stat"><div class="stat-top">Kelompok produk <span class="stat-icon">▦</span></div><div class="stat-value">${groups.length}</div><div class="stat-note">Item Group ID unik</div></div>
<div class="stat"><div class="stat-top">Total record <span class="stat-icon">▤</span></div><div class="stat-value">${variants}</div><div class="stat-note">Data produk di database</div></div>
<div class="stat"><div class="stat-top">Record tersedia <span class="stat-icon">◉</span></div><div class="stat-value">${available}</div><div class="stat-note">Berdasarkan nilai availability aktual</div></div>
<div class="stat"><div class="stat-top">Jumlah varian <span class="stat-icon">◇</span></div><div class="stat-value">${variants-groups.length}</div><div class="stat-note">Record di luar satu record per grup</div></div>
</section>
<div class="page-head" style="margin:8px 0 14px"><div><h1 style="font-size:18px;letter-spacing:-.4px">Kelompok produk</h1><p class="sub">Produk yang terakhir dimuat dari backend.</p></div><button class="btn" id="seeAll">Lihat semua →</button></div>
<section class="panel"><div class="product-grid">${groups.length?groups.slice(0,6).map(cardHTML).join(""):'<div class="empty" style="grid-column:1/-1"><b>Belum ada produk</b>Tambahkan produk pertama untuk memulai.</div>'}</div></section>`;
$("#addProduct").onclick=()=>openProductForm();$("#seeAll").onclick=()=>setPage("products");bindCards()}
function cardHTML(g){const p=g.first;return `<article class="product-card" data-group="${esc(g.key)}"><div class="product-image">${p.image_link?'<img loading="lazy" src="'+esc(p.image_link)+'" alt="'+esc(p.title)+'" onerror="this.remove()">':'<span class="placeholder">D</span>'}<span class="pill">${g.items.length} varian</span></div><div class="product-info"><div class="group">GROUP · ${esc(g.key||"—")}</div><h3>${esc(p.title||"Tanpa judul")}</h3><div class="price">${groupPrice(g)}</div><div class="variant-count">${esc(p.brand||"Divoom")} · ${g.items.length} record</div></div></article>`}
function renderProducts(){const groups=filteredGroups();const brands=[...new Set(state.records.map(p=>p.brand).filter(Boolean))].sort();const avail=[...new Set(state.records.map(p=>p.availability).filter(Boolean))].sort();$("#main").innerHTML=`
<div class="page-head"><div><p class="eyebrow">Manajemen katalog</p><h1>Produk</h1><p class="sub">Kelola kelompok produk, detail, dan varian warna atau ukuran.</p></div><button class="btn primary" id="addProduct">＋ Tambah produk</button></div>
<section class="panel"><div class="toolbar"><div class="search"><input id="searchInput" type="search" placeholder="Cari nama produk, brand, atau group ID…" value="${esc(state.query)}"></div><select id="availabilityFilter"><option value="">Semua status</option>${avail.map(x=>'<option '+(x===state.availability?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join("")}</select><select id="brandFilter"><option value="">Semua brand</option>${brands.map(x=>'<option '+(x===state.brand?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join("")}</select><select id="sortFilter"><option value="name" ${state.sort==="name"?"selected":""}>Nama A–Z</option><option value="price" ${state.sort==="price"?"selected":""}>Harga terendah</option></select></div><div class="count">${groups.length} kelompok produk · ${state.records.length} record</div><div class="product-grid" id="productGrid">${groups.length?groups.map(cardHTML).join(""):'<div class="empty" style="grid-column:1/-1"><b>Produk tidak ditemukan</b>Coba ubah kata kunci atau filter.</div>'}</div></section>`;
$("#addProduct").onclick=()=>openProductForm();$("#searchInput").oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;renderProducts();const el=$("#searchInput");el.focus();el.setSelectionRange(pos,pos)};$("#availabilityFilter").onchange=e=>{state.availability=e.target.value;renderProducts()};$("#brandFilter").onchange=e=>{state.brand=e.target.value;renderProducts()};$("#sortFilter").onchange=e=>{state.sort=e.target.value;renderProducts()};bindCards()}
function bindCards(){document.querySelectorAll("[data-group]").forEach(el=>el.onclick=()=>openGroup(el.dataset.group))}
function setPage(page){state.page=page;render()}
function openModal(html,narrow=false){$("#dialog").className="dialog"+(narrow?" narrow":"");$("#dialog").innerHTML=html;$("#modalOverlay").classList.add("show");document.body.style.overflow="hidden"}
function closeModal(){$("#modalOverlay").classList.remove("show");document.body.style.overflow=""}
$("#modalOverlay").addEventListener("click",e=>{if(e.target.id==="modalOverlay")closeModal()});
function dialogHead(title){return '<div class="dialog-head"><h2>'+title+'</h2><button class="close" data-close aria-label="Tutup">×</button></div>'}
function closeBinding(){$("[data-close]")?.addEventListener("click",closeModal)}
function openProductForm(record=null,groupId=""){const editing=!!record;const p=record||{};const fields=[["item_group_id","Item Group ID","text",groupId||p.item_group_id||""],["title","Nama produk","text",p.title||""],["price","Harga","number",p.price??""],["sale_price","Harga diskon","number",p.sale_price??""],["brand","Brand","text",p.brand||"Divoom"],["availability","Availability","text",p.availability||""],["condition","Condition","text",p.condition||"new"],["color","Warna","text",p.color||""],["size","Ukuran","text",p.size||""],["material","Material","text",p.material||""],["pattern","Pattern","text",p.pattern||""],["gender","Gender","text",p.gender||""],["age_group","Age group","text",p.age_group||""],["product_type","Product type","text",p.product_type||""],["google_product_category","Google category","text",p.google_product_category||""],["link","Product link","url",p.link||""],["additional_variant_attribute","Atribut varian tambahan","text",p.additional_variant_attribute||""]];
const fieldsHTML=fields.map(([name,label,type,value])=>'<div class="field '+(["title","item_group_id","link","google_product_category","additional_variant_attribute"].includes(name)?"full":"")+'"><label for="f_'+name+'">'+label+(["item_group_id","title","price"].includes(name)?' *':'')+'</label><input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(["item_group_id","title","price"].includes(name)?"required":"")+' '+(editing&&name==="item_group_id"?'readonly':'')+'></div>').join("");
openModal(dialogHead(editing?"Edit varian produk":"Tambah produk")+'<form id="productForm"><div class="dialog-body"><div class="form-grid">'+fieldsHTML+'<div class="field full"><label for="description">Deskripsi</label><textarea id="description" name="description">'+esc(p.description||"")+'</textarea></div><div class="field full"><label for="rich_text_description">Deskripsi lengkap (teks/HTML)</label><textarea id="rich_text_description" name="rich_text_description">'+esc(p.rich_text_description||"")+'</textarea></div><div class="field full"><label>Gambar utama '+(editing?"(opsional, pilih untuk mengganti)":"*")+'</label><div class="filebox"><input type="file" id="mainImage" accept="image/jpeg,image/png,image/webp" '+(!editing?"required":"")+'><div class="preview" id="mainPreview">'+(p.image_link?'<img src="'+esc(p.image_link)+'" alt="Gambar utama saat ini">':"")+'</div><small>JPEG, PNG, WebP · maksimal 5 MB.</small></div></div><div class="field full"><label>Gambar tambahan</label><div class="filebox"><input type="file" id="extraImages" accept="image/jpeg,image/png,image/webp" multiple '+(editing?'disabled':'')+'><div class="preview" id="extraPreview"></div><small>Maksimal 5 gambar tambahan per record. Saat edit, kelola gambar tambahan dari detail produk.</small></div></div></div></div><div class="dialog-foot"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="saveProduct">Simpan produk</button></div></form>');
closeBinding();$("#mainImage").onchange=e=>previewFiles(e.target.files,"mainPreview",true);$("#extraImages").onchange=e=>previewFiles(e.target.files,"extraPreview",false);$("#productForm").onsubmit=e=>saveProduct(e,record)}
function previewFiles(files,target,one){const el=$("#"+target);el.innerHTML="";[...files].slice(0,one?1:5).forEach(f=>{const u=URL.createObjectURL(f);const img=document.createElement("img");img.src=u;img.alt=f.name;el.append(img)})}
function getProductData(form){const fd=new FormData(form),data={};PRODUCT_FIELDS.forEach(k=>{if(fd.has(k)){const v=fd.get(k);if(v!=="")data[k]=["price","sale_price"].includes(k)?Number(v):v}});return data}
async function saveProduct(e,record){e.preventDefault();const form=e.currentTarget,btn=$("#saveProduct"),data=getProductData(form),main=$("#mainImage").files[0],extras=[...$("#extraImages").files];if(!record&&!main){toast("Gambar utama wajib dipilih.");return}if(main&&main.size>5*1024*1024||extras.some(f=>f.size>5*1024*1024)){toast("Ukuran setiap gambar maksimal 5 MB.");return}if(extras.length>5){toast("Maksimal 5 gambar tambahan.");return}btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Menyimpan…';try{const body=new FormData();body.append("product",JSON.stringify(data));if(record){body.append("id",record.id);if(main)body.append("image_link",main);await api("",{method:"PATCH",body})}else{body.append("image_link",main);extras.forEach(f=>body.append("additional_image_link",f));await api("",{method:"POST",body})}closeModal();toast(record?"Perubahan varian tersimpan.":"Produk berhasil ditambahkan.");await load()}catch(err){toast("Gagal menyimpan: "+err.message);btn.disabled=false;btn.textContent="Simpan produk"}}
function openGroup(key){const g=groupRecords().find(x=>x.key===key);if(!g)return;state.activeGroup=key;const p=g.first;const extras=Array.isArray(p.additional_image_link)?p.additional_image_link:[];openModal(dialogHead("Detail kelompok produk")+'<div class="dialog-body"><div class="detail-hero"><div>'+(p.image_link?'<img class="detail-main-img" src="'+esc(p.image_link)+'" alt="">':'<div class="detail-main-img placeholder">D</div>')+'</div><div><div class="eyebrow">ITEM GROUP · '+esc(key)+'</div><h3 class="detail-title">'+esc(p.title||"Tanpa judul")+'</h3><div class="detail-meta">'+esc(p.brand||"—")+'<br>'+groupPrice(g)+'<br>'+g.items.length+' record varian</div><p class="detail-meta">'+esc(p.description||"")+'</p><button class="btn primary small" id="addVariant">＋ Tambah varian</button></div></div><div class="variant-list"><h3 style="font:700 13px Manrope;margin:6px 0 2px">Daftar varian</h3>'+g.items.map(v=>'<div class="variant-row"><div class="variant-data"><b>'+esc([v.color,v.size].filter(Boolean).join(" / ")||"Varian tanpa atribut")+'</b><small>ID: '+esc(v.id)+' · '+esc(v.availability||"Status tidak diisi")+' · '+money(v.sale_price||v.price)+'</small></div><div class="variant-actions"><button class="btn small" data-edit="'+esc(v.id)+'">Edit</button><button class="btn danger small" data-delete="'+esc(v.id)+'">Hapus</button></div></div>').join("")+'</div>'+(extras.length?'<h3 style="font:700 13px Manrope;margin:20px 0 10px">Gambar tambahan</h3><div class="preview">'+extras.map(u=>'<img src="'+esc(u)+'" alt="Gambar tambahan">').join("")+'</div>':'')+'</div>');
closeBinding();$("#addVariant").onclick=()=>openProductForm(null,key);document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const rec=g.items.find(x=>String(x.id)===b.dataset.edit);if(rec)openProductForm(rec)});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>confirmDelete(b.dataset.delete,key))}
function confirmDelete(id,key){openModal(dialogHead("Hapus varian?")+'<div class="dialog-body"><p style="font-size:12px;line-height:1.7;color:#667168">Varian ini akan dihapus permanen. Varian lain dalam kelompok <b>'+esc(key)+'</b> tidak akan ikut terhapus.</p></div><div class="dialog-foot"><button class="btn" data-close>Batal</button><button class="btn danger" id="confirmDelete">Hapus varian</button></div>',true);closeBinding();$("#confirmDelete").onclick=async()=>{const b=$("#confirmDelete");b.disabled=true;b.textContent="Menghapus…";try{await api("?id="+encodeURIComponent(id),{method:"DELETE"});closeModal();toast("Varian berhasil dihapus.");await load();if(groupRecords().some(g=>g.key===key))openGroup(key);else setPage("products")}catch(e){toast("Gagal menghapus: "+e.message);b.disabled=false;b.textContent="Hapus varian"}}}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
$("#mobileAdd").onclick=()=>openProductForm();$("#refreshBtn").onclick=load;
load();
})();
</script>
</body>
</html>
