<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f6">
<meta name="description" content="Divoom Product Manager — kelola katalog, gambar, dan varian produk.">
<meta name="color-scheme" content="light">
<title>Divoom Product Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style type="text/tailwindcss">
@theme{--font-sans:"DM Sans",ui-sans-serif,system-ui,sans-serif;--font-display:"Manrope",ui-sans-serif,system-ui,sans-serif}
@layer base{
*{@apply box-border}html,body{@apply m-0 min-h-full bg-stone-50 font-sans text-slate-800 antialiased}
button,input,select,textarea{@apply font-sans}button{@apply cursor-pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{@apply outline-2 outline-offset-2 outline-emerald-600}
}
@layer components{
.app{@apply flex min-h-screen flex-col}.topbar{@apply sticky top-0 z-20 flex h-16 flex-none items-center justify-between border-b border-slate-200 bg-white/95 px-4 backdrop-blur-xl sm:px-6}
.brand{@apply flex items-center gap-3}.brand-mark{@apply grid size-9 place-items-center rounded-xl bg-emerald-50 font-display text-lg font-extrabold text-emerald-700}
.brand strong{@apply block font-display text-sm font-extrabold text-slate-900}.brand small{@apply mt-0.5 block text-[10px] text-slate-400}
.top-actions{@apply flex gap-2}.icon-btn{@apply grid size-10 place-items-center rounded-xl border border-slate-200 bg-white text-lg text-slate-700}
.layout{@apply mx-auto flex w-full max-w-screen-2xl flex-1}.sidebar{@apply w-56 flex-none border-r border-slate-200 bg-white/70 px-3 py-7}
.nav-label{@apply px-3 pb-2 text-[9px] font-bold uppercase tracking-widest text-slate-400}.nav-btn{@apply my-1 flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-xs font-semibold text-slate-500 hover:bg-emerald-50 hover:text-emerald-700}
.nav-btn span:first-child{@apply w-5 text-center text-base}.nav-btn.active{@apply bg-emerald-50 text-emerald-700}
#main{@apply min-w-0 flex-1 px-5 py-7 pb-24 sm:px-8 lg:px-10}.page-head{@apply mb-6 flex items-end justify-between gap-4}
.eyebrow{@apply mb-2 text-[9px] font-extrabold uppercase tracking-[.18em] text-emerald-700}.page-head h1{@apply m-0 font-display text-3xl font-extrabold tracking-tight text-slate-900}
.sub{@apply mt-2 text-xs leading-relaxed text-slate-500}.btn{@apply inline-flex min-h-10 items-center justify-center gap-2 rounded-xl border border-slate-200 bg-white px-4 text-xs font-bold text-slate-700 transition hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-50}
.btn.primary{@apply border-emerald-700 bg-emerald-700 text-white hover:bg-emerald-800}.btn.danger{@apply border-rose-200 text-rose-700 hover:bg-rose-50}.btn.small{@apply min-h-8 rounded-lg px-3 text-[10px]}
.stats{@apply mb-6 grid grid-cols-2 gap-3 xl:grid-cols-4}.stat{@apply rounded-2xl border border-slate-200 bg-white p-4 shadow-sm}
.stat-top{@apply flex items-center justify-between gap-2 text-[10px] font-semibold text-slate-500}.stat-icon{@apply text-base text-emerald-700}.stat-value{@apply mt-3 font-display text-2xl font-extrabold tracking-tight text-slate-900}.stat-note{@apply mt-1 text-[9px] text-slate-400}
.panel{@apply overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm}.toolbar{@apply flex flex-wrap items-center gap-2 border-b border-slate-100 p-3 sm:p-4}
.search{@apply relative min-w-0 flex-1 basis-full sm:basis-56}.search input{@apply h-10 w-full rounded-xl border border-slate-200 bg-stone-50 px-3 pl-10 text-xs}
.search:before{content:"⌕";@apply pointer-events-none absolute left-3 top-1 text-xl text-slate-400}.toolbar select{@apply h-10 min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-3 text-[10px] text-slate-600 sm:flex-none}
.count{@apply border-b border-slate-100 px-4 py-3 text-[10px] text-slate-500}.product-grid{@apply grid grid-cols-2 gap-2.5 p-3 sm:gap-3.5 sm:p-4 lg:grid-cols-3 2xl:grid-cols-4}
.product-card{@apply min-w-0 cursor-pointer overflow-hidden rounded-xl border border-slate-200 bg-white transition hover:-translate-y-0.5 hover:border-emerald-200 hover:shadow-md}
.product-image{@apply relative grid aspect-square place-items-center overflow-hidden bg-stone-100 sm:aspect-[1.15]}.product-image img{@apply size-full object-cover}
.placeholder{@apply font-serif text-4xl italic text-slate-300}.pill{@apply inline-flex items-center rounded-full bg-emerald-50 px-2.5 py-1 text-[9px] font-bold text-emerald-700}
.product-image .pill{@apply absolute left-2 top-2 bg-white/95}.product-info{@apply p-2.5 sm:p-3}.product-info .group{@apply break-all text-[9px] text-slate-400}
.product-info h3{@apply my-1.5 min-h-8 line-clamp-2 font-display text-[11px] font-bold leading-relaxed sm:text-xs}.price{@apply text-xs font-extrabold text-slate-900}.variant-count{@apply mt-2 text-[9px] text-slate-500}
.empty,.loading{@apply px-5 py-14 text-center text-xs text-slate-500}.empty b{@apply mb-2 block font-display text-base font-bold text-slate-800}.error{@apply rounded-xl border border-rose-200 bg-rose-50 p-5 text-xs text-rose-700}
.mobile-nav{@apply fixed inset-x-0 bottom-0 z-30 grid grid-cols-3 border-t border-slate-200 bg-white/95 px-3 pt-2 backdrop-blur-xl; padding-bottom:calc(.5rem + env(safe-area-inset-bottom))}
.mobile-nav button{@apply grid justify-items-center gap-1 border-0 bg-transparent px-2 py-1.5 text-[9px] text-slate-400}.mobile-nav button span{@apply text-lg}.mobile-nav button.active{@apply font-extrabold text-emerald-700}
.overlay{@apply fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/50 p-4}.overlay.show{@apply flex}.dialog{@apply max-h-[90vh] w-full max-w-3xl overflow-y-auto rounded-2xl bg-white shadow-2xl}.dialog.narrow{@apply max-w-md}
.dialog-head{@apply sticky top-0 z-10 flex items-center justify-between border-b border-slate-100 bg-white/95 px-5 py-4 backdrop-blur-xl}.dialog-head h2{@apply m-0 font-display text-base font-extrabold}
.close{@apply grid size-9 place-items-center rounded-xl border border-slate-200 bg-white text-xl text-slate-600}.dialog-body{@apply p-4 sm:p-5}
.form-grid{@apply grid grid-cols-1 gap-3 sm:grid-cols-2}.field{@apply grid min-w-0 gap-1.5}.field.full{@apply sm:col-span-2}.field label{@apply text-[10px] font-bold text-slate-600}
.field input,.field select,.field textarea{@apply min-h-10 w-full rounded-xl border border-slate-200 bg-stone-50 px-3 py-2 text-xs text-slate-800}.field textarea{@apply min-h-24 resize-y}.field small{@apply text-[9px] text-slate-400}
.filebox{@apply rounded-xl border border-dashed border-emerald-200 bg-emerald-50/40 p-3}.preview{@apply mt-2 flex flex-wrap gap-2}.preview img{@apply size-16 rounded-lg border border-slate-200 object-cover}
.dialog-foot{@apply sticky bottom-0 flex justify-end gap-2 border-t border-slate-100 bg-white p-3 sm:px-5}
.detail-hero{@apply grid grid-cols-[100px_minmax(0,1fr)] gap-3 sm:grid-cols-[180px_minmax(0,1fr)] sm:gap-5}.detail-main-img{@apply aspect-square w-full rounded-xl bg-stone-100 object-cover}
.detail-title{@apply my-1.5 font-display text-base font-extrabold leading-snug sm:text-xl}.detail-meta{@apply text-[10px] leading-relaxed text-slate-500}
.variant-list{@apply mt-5 grid gap-2}.variant-row{@apply flex flex-col gap-3 rounded-xl border border-slate-200 p-3 sm:flex-row sm:items-center sm:justify-between}
.variant-data{@apply min-w-0}.variant-data b{@apply block text-xs}.variant-data small{@apply mt-1 block text-[9px] text-slate-500}.variant-actions{@apply flex flex-wrap gap-1.5}
.toast{@apply pointer-events-none fixed bottom-24 left-1/2 z-50 max-w-[calc(100%-2rem)] -translate-x-1/2 translate-y-3 rounded-xl bg-emerald-950 px-4 py-3 text-center text-[11px] text-white opacity-0 shadow-xl transition}
.toast.show{@apply translate-y-0 opacity-100}.spinner{@apply inline-block size-3.5 animate-spin rounded-full border-2 border-emerald-100 border-t-emerald-700 align-middle}
.muted{@apply text-slate-500}
}
@media(min-width:641px){.mobile-nav{@apply hidden}}
@media(max-width:640px){
.sidebar{@apply hidden}#main{@apply px-3.5 py-5 pb-28}.page-head{@apply items-start flex-col}.page-head>.btn{@apply w-full}
.stats{@apply gap-2}.stat{@apply p-3}.stat-value{@apply mt-2 text-xl}.toolbar select{@apply flex-1}
.overlay{@apply items-end p-0}.dialog,.dialog.narrow{@apply max-h-[94dvh] max-w-none rounded-b-none rounded-t-2xl; padding-bottom:env(safe-area-inset-bottom)}
.dialog-foot .btn{@apply flex-1}
}
@media(max-width:360px){.product-grid{@apply gap-2 p-2}.product-info{@apply p-2}.stat-value{@apply text-lg}}
</style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-mark">D</div><div><strong>Divoom Manager</strong><small>PRODUCT WORKSPACE</small></div></div>
  <div class="top-actions"><button class="icon-btn" id="refreshBtn" aria-label="Muat ulang">↻</button></div>
</header>
<div class="layout">
<aside class="sidebar">
  <div class="nav-label">Workspace</div>
  <button class="nav-btn active" data-page="dashboard"><span>▦</span>Dasbor</button>
  <button class="nav-btn" data-page="products"><span>▤</span>Produk</button>
  <div class="nav-label mt-6">Koneksi</div>
  <div class="px-3 text-[10px] leading-relaxed text-slate-500">Supabase Edge Function<br><b class="font-bold text-emerald-700">crud-divoom · v2</b></div>
</aside>
<main id="main" class="min-w-0">
  <div class="loading"><span class="spinner"></span> Menghubungkan ke katalog produk…</div>
</main>
</div>
<nav class="mobile-nav">
  <button class="active" data-page="dashboard"><span>▦</span>Dasbor</button>
  <button data-page="products"><span>▤</span>Produk</button>
  <button id="mobileAdd"><span>＋</span>Tambah</button>
</nav>
</div>
<div class="overlay" id="modalOverlay" role="dialog" aria-modal="true"><section class="dialog" id="dialog"></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
"use strict";
const SUPABASE_URL="https://mvwflakurihhakdrlteg.supabase.co";
const API_URL=SUPABASE_URL+"/functions/v1/crud-divoom";
const PRODUCT_FIELDS=["item_group_id","title","description","rich_text_description","availability","condition","price","sale_price","link","brand","google_product_category","product_type","color","size","material","pattern","gender","age_group","additional_variant_attribute"];
const state={records:[],page:"dashboard",query:"",availability:"",brand:"",sort:"name",activeGroup:null,loading:false};
const $=(s,root=document)=>root.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>{const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n):"—"};
const groupRecords=()=>{const m=new Map();state.records.forEach(p=>{const k=String(p.item_group_id??"");if(!m.has(k))m.set(k,[]);m.get(k).push(p)});return [...m.entries()].map(([key,items])=>({key,items,first:items[0]}))};
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2800)}
async function api(path="",options={}){const res=await fetch(API_URL+path,options);let body;try{body=await res.json()}catch{body={message:"Respons server tidak valid."}}if(!res.ok||body.success===false){throw new Error(body.message||("Permintaan gagal ("+res.status+")"))}return body}
async function load(){state.loading=true;render();try{const result=await api();state.records=Array.isArray(result.data)?result.data:[];state.loading=false;render()}catch(e){state.loading=false;$("#main").innerHTML='<div class="error">Gagal memuat data: '+esc(e.message)+'<br><br><button class="btn" id="retry">Coba lagi</button></div>';$("#retry").onclick=load}}
function isAvailable(p){const v=String(p.availability??"").toLowerCase();return ["in stock","available","tersedia","in_stock"].includes(v)}
function groupPrice(g){const nums=g.items.map(p=>Number(p.sale_price||p.price)).filter(Number.isFinite);if(!nums.length)return "Harga belum tersedia";const min=Math.min(...nums),max=Math.max(...nums);return min===max?money(min):money(min)+" – "+money(max)}
function filteredGroups(){let a=groupRecords().filter(g=>{const p=g.first,q=state.query.toLowerCase();return (!q||(String(p.title||"").toLowerCase().includes(q)||g.key.toLowerCase().includes(q)||g.items.some(x=>String(x.brand||"").toLowerCase().includes(q))))&&(!state.availability||g.items.some(x=>String(x.availability||"")===state.availability))&&(!state.brand||g.items.some(x=>x.brand===state.brand))});a.sort((x,y)=>state.sort==="name"?String(x.first.title||"").localeCompare(String(y.first.title||"")):state.sort==="price"?Math.min(...x.items.map(p=>Number(p.price)||0))-Math.min(...y.items.map(p=>Number(p.price)||0)):0);return a}
function navActive(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page))}
function render(){navActive();if(state.page==="dashboard")renderDashboard();else renderProducts()}
function renderDashboard(){const groups=groupRecords(),variants=state.records.length,available=state.records.filter(isAvailable).length;$("#main").innerHTML=`
<div class="page-head"><div><p class="eyebrow">Ringkasan katalog</p><h1>Dasbor</h1><p class="sub">Pantau produk dan varian Divoom dalam satu tempat.</p></div><button class="btn primary" id="addProduct">＋ Tambah produk</button></div>
<section class="stats">
<div class="stat rounded-2xl border border-slate-200 bg-white shadow-sm"><div class="stat-top">Kelompok produk <span class="stat-icon">▦</span></div><div class="stat-value">${groups.length}</div><div class="stat-note">Item Group ID unik</div></div>
<div class="stat"><div class="stat-top">Total record <span class="stat-icon">▤</span></div><div class="stat-value">${variants}</div><div class="stat-note">Data produk di database</div></div>
<div class="stat"><div class="stat-top">Record tersedia <span class="stat-icon">◉</span></div><div class="stat-value">${available}</div><div class="stat-note">Berdasarkan nilai availability aktual</div></div>
<div class="stat"><div class="stat-top">Jumlah varian <span class="stat-icon">◇</span></div><div class="stat-value">${variants-groups.length}</div><div class="stat-note">Record di luar satu record per grup</div></div>
</section>
<div class="page-head" style="margin:8px 0 14px"><div><h1 style="font-size:18px;letter-spacing:-.4px">Kelompok produk</h1><p class="sub">Produk yang terakhir dimuat dari backend.</p></div><button class="btn" id="seeAll">Lihat semua →</button></div>
<section class="panel"><div class="product-grid">${groups.length?groups.slice(0,6).map(cardHTML).join(""):'<div class="empty" style="grid-column:1/-1"><b>Belum ada produk</b>Tambahkan produk pertama untuk memulai.</div>'}</div></section>`;
$("#addProduct").onclick=()=>openProductForm();$("#seeAll").onclick=()=>setPage("products");bindCards()}
function cardHTML(g){const p=g.first;return `<article class="product-card" data-group="${esc(g.key)}"><div class="product-image">${p.image_link?'<img loading="lazy" src="'+esc(p.image_link)+'" alt="'+esc(p.title)+'" onerror="this.remove()">':'<span class="placeholder">D</span>'}<span class="pill">${g.items.length} varian</span></div><div class="product-info"><div class="group">GROUP · ${esc(g.key||"—")}</div><h3>${esc(p.title||"Tanpa judul")}</h3><div class="price">${groupPrice(g)}</div><div class="variant-count">${esc(p.brand||"Divoom")} · ${g.items.length} record</div></div></article>`}
function renderProducts(){const groups=filteredGroups();const brands=[...new Set(state.records.map(p=>p.brand).filter(Boolean))].sort();const avail=[...new Set(state.records.map(p=>p.availability).filter(Boolean))].sort();$("#main").innerHTML=`
<div class="page-head"><div><p class="eyebrow">Manajemen katalog</p><h1>Produk</h1><p class="sub">Kelola kelompok produk, detail, dan varian warna atau ukuran.</p></div><button class="btn primary" id="addProduct">＋ Tambah produk</button></div>
<section class="panel rounded-2xl border border-slate-200 bg-white shadow-sm"><div class="toolbar"><div class="search"><input id="searchInput" type="search" placeholder="Cari nama produk, brand, atau group ID…" value="${esc(state.query)}"></div><select id="availabilityFilter"><option value="">Semua status</option>${avail.map(x=>'<option '+(x===state.availability?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join("")}</select><select id="brandFilter"><option value="">Semua brand</option>${brands.map(x=>'<option '+(x===state.brand?'selected':'')+' value="'+esc(x)+'">'+esc(x)+'</option>').join("")}</select><select id="sortFilter"><option value="name" ${state.sort==="name"?"selected":""}>Nama A–Z</option><option value="price" ${state.sort==="price"?"selected":""}>Harga terendah</option></select></div><div class="count">${groups.length} kelompok produk · ${state.records.length} record</div><div class="product-grid" id="productGrid">${groups.length?groups.map(cardHTML).join(""):'<div class="empty" style="grid-column:1/-1"><b>Produk tidak ditemukan</b>Coba ubah kata kunci atau filter.</div>'}</div></section>`;
$("#addProduct").onclick=()=>openProductForm();$("#searchInput").oninput=e=>{state.query=e.target.value;const pos=e.target.selectionStart;renderProducts();const el=$("#searchInput");el.focus();el.setSelectionRange(pos,pos)};$("#availabilityFilter").onchange=e=>{state.availability=e.target.value;renderProducts()};$("#brandFilter").onchange=e=>{state.brand=e.target.value;renderProducts()};$("#sortFilter").onchange=e=>{state.sort=e.target.value;renderProducts()};bindCards()}
function bindCards(){document.querySelectorAll("[data-group]").forEach(el=>el.onclick=()=>openGroup(el.dataset.group))}
function setPage(page){state.page=page;render()}
function openModal(html,narrow=false){$("#dialog").className="dialog"+(narrow?" narrow":"");$("#dialog").innerHTML=html;$("#modalOverlay").classList.add("show");document.body.style.overflow="hidden"}
function closeModal(){$("#modalOverlay").classList.remove("show");document.body.style.overflow=""}
$("#modalOverlay").addEventListener("click",e=>{if(e.target.id==="modalOverlay")closeModal()});
function dialogHead(title){return '<div class="dialog-head"><h2>'+title+'</h2><button class="close" data-close aria-label="Tutup">×</button></div>'}
function closeBinding(){$("[data-close]")?.addEventListener("click",closeModal)}
function openProductForm(record=null,groupId=""){const editing=!!record;const p=record||{};const fields=[["item_group_id","Item Group ID","text",groupId||p.item_group_id||""],["title","Nama produk","text",p.title||""],["price","Harga","number",p.price??""],["sale_price","Harga diskon","number",p.sale_price??""],["brand","Brand","text",p.brand||"Divoom"],["availability","Availability","text",p.availability||""],["condition","Condition","text",p.condition||"new"],["color","Warna","text",p.color||""],["size","Ukuran","text",p.size||""],["material","Material","text",p.material||""],["pattern","Pattern","text",p.pattern||""],["gender","Gender","text",p.gender||""],["age_group","Age group","text",p.age_group||""],["product_type","Product type","text",p.product_type||""],["google_product_category","Google category","text",p.google_product_category||""],["link","Product link","url",p.link||""],["additional_variant_attribute","Atribut varian tambahan","text",p.additional_variant_attribute||""]];
const fieldsHTML=fields.map(([name,label,type,value])=>'<div class="field '+(["title","item_group_id","link","google_product_category","additional_variant_attribute"].includes(name)?"full":"")+'"><label for="f_'+name+'">'+label+(["item_group_id","title","price"].includes(name)?' *':'')+'</label><input id="f_'+name+'" name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+(["item_group_id","title","price"].includes(name)?"required":"")+' '+(editing&&name==="item_group_id"?'readonly':'')+'></div>').join("");
openModal(dialogHead(editing?"Edit varian produk":"Tambah produk")+'<form id="productForm"><div class="dialog-body"><div class="form-grid">'+fieldsHTML+'<div class="field full"><label for="description">Deskripsi</label><textarea id="description" name="description">'+esc(p.description||"")+'</textarea></div><div class="field full"><label for="rich_text_description">Deskripsi lengkap (teks/HTML)</label><textarea id="rich_text_description" name="rich_text_description">'+esc(p.rich_text_description||"")+'</textarea></div><div class="field full"><label>Gambar utama '+(editing?"(opsional, pilih untuk mengganti)":"*")+'</label><div class="filebox"><input type="file" id="mainImage" accept="image/jpeg,image/png,image/webp" '+(!editing?"required":"")+'><div class="preview" id="mainPreview">'+(p.image_link?'<img src="'+esc(p.image_link)+'" alt="Gambar utama saat ini">':"")+'</div><small>JPEG, PNG, WebP · maksimal 5 MB.</small></div></div><div class="field full"><label>Gambar tambahan</label><div class="filebox"><input type="file" id="extraImages" accept="image/jpeg,image/png,image/webp" multiple '+(editing?'disabled':'')+'><div class="preview" id="extraPreview"></div><small>Maksimal 5 gambar tambahan per record. Saat edit, kelola gambar tambahan dari detail produk.</small></div></div></div></div><div class="dialog-foot"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="saveProduct">Simpan produk</button></div></form>');
closeBinding();$("#mainImage").onchange=e=>previewFiles(e.target.files,"mainPreview",true);$("#extraImages").onchange=e=>previewFiles(e.target.files,"extraPreview",false);$("#productForm").onsubmit=e=>saveProduct(e,record)}
function previewFiles(files,target,one){const el=$("#"+target);el.innerHTML="";[...files].slice(0,one?1:5).forEach(f=>{const u=URL.createObjectURL(f);const img=document.createElement("img");img.src=u;img.alt=f.name;img.onload=()=>URL.revokeObjectURL(u);el.append(img)})}
function getProductData(form){const fd=new FormData(form),data={};PRODUCT_FIELDS.forEach(k=>{if(fd.has(k)){const v=fd.get(k);data[k]=v===""?null:(["price","sale_price"].includes(k)?Number(v):v)}});return data}
async function saveProduct(e,record){e.preventDefault();const form=e.currentTarget,btn=$("#saveProduct"),data=getProductData(form),main=$("#mainImage").files[0],extras=[...$("#extraImages").files];if(!record&&!main){toast("Gambar utama wajib dipilih.");return}if(main&&main.size>5*1024*1024||extras.some(f=>f.size>5*1024*1024)){toast("Ukuran setiap gambar maksimal 5 MB.");return}if(extras.length>5){toast("Maksimal 5 gambar tambahan.");return}btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Menyimpan…';try{const body=new FormData();body.append("product",JSON.stringify(data));if(record){body.append("id",record.id);if(main)body.append("image_link",main);await api("",{method:"PATCH",body})}else{body.append("image_link",main);extras.forEach(f=>body.append("additional_image_link",f));await api("",{method:"POST",body})}closeModal();toast(record?"Perubahan varian tersimpan.":"Produk berhasil ditambahkan.");await load()}catch(err){toast("Gagal menyimpan: "+err.message);btn.disabled=false;btn.textContent="Simpan produk"}}
function openGroup(key){const g=groupRecords().find(x=>x.key===key);if(!g)return;state.activeGroup=key;const p=g.first;const extras=Array.isArray(p.additional_image_link)?p.additional_image_link:[];openModal(dialogHead("Detail kelompok produk")+'<div class="dialog-body"><div class="detail-hero"><div>'+(p.image_link?'<img class="detail-main-img" src="'+esc(p.image_link)+'" alt="">':'<div class="detail-main-img placeholder">D</div>')+'</div><div><div class="eyebrow">ITEM GROUP · '+esc(key)+'</div><h3 class="detail-title">'+esc(p.title||"Tanpa judul")+'</h3><div class="detail-meta">'+esc(p.brand||"—")+'<br>'+groupPrice(g)+'<br>'+g.items.length+' record varian</div><p class="detail-meta">'+esc(p.description||"")+'</p><button class="btn primary small" id="addVariant">＋ Tambah varian</button></div></div><div class="variant-list"><h3 style="font:700 13px Manrope;margin:6px 0 2px">Daftar varian</h3>'+g.items.map(v=>'<div class="variant-row"><div class="variant-data"><b>'+esc([v.color,v.size].filter(Boolean).join(" / ")||"Varian tanpa atribut")+'</b><small>ID: '+esc(v.id)+' · '+esc(v.availability||"Status tidak diisi")+' · '+money(v.sale_price||v.price)+'</small></div><div class="variant-actions"><button class="btn small" data-edit="'+esc(v.id)+'">Edit</button><button class="btn danger small" data-delete="'+esc(v.id)+'">Hapus</button></div></div>').join("")+'</div>'+'<section class="mt-5"><div class="flex items-center justify-between gap-3"><h3 class="font-display text-sm font-bold">Gambar tambahan ('+extras.length+'/5)</h3><button class="btn small" id="addExtraImage" '+(extras.length>=5?"disabled":"")+' >＋ Tambah</button></div><div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-3">'+(extras.length?extras.map((u,i)=>'<div class="rounded-xl border border-slate-200 p-2"><img class="aspect-square w-full rounded-lg object-cover" src="'+esc(u)+'" alt="Gambar tambahan '+(i+1)+'"><div class="mt-2 flex gap-1"><button class="btn small flex-1" data-replace-extra="'+esc(u)+'">Ganti</button><button class="btn danger small flex-1" data-remove-extra="'+esc(u)+'">Hapus</button></div></div>').join(""):'<p class="col-span-full text-xs text-slate-400">Belum ada gambar tambahan.</p>')+'</div></section></div>');
closeBinding();$("#addVariant").onclick=()=>openProductForm(null,key);$("#addExtraImage").onclick=()=>manageAdditionalImage(g.items[0].id,"add");document.querySelectorAll("[data-replace-extra]").forEach(b=>b.onclick=()=>manageAdditionalImage(g.items[0].id,"replace",b.dataset.replaceExtra));document.querySelectorAll("[data-remove-extra]").forEach(b=>b.onclick=()=>manageAdditionalImage(g.items[0].id,"remove",b.dataset.removeExtra));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{const rec=g.items.find(x=>String(x.id)===b.dataset.edit);if(rec)openProductForm(rec)});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>confirmDelete(b.dataset.delete,key))}
function manageAdditionalImage(id,action,targetUrl=""){
 const title=action==="add"?"Tambah gambar tambahan":action==="replace"?"Ganti gambar tambahan":"Hapus gambar tambahan";
 const isRemove=action==="remove";
 const content=isRemove
  ?'<div class="dialog-body"><p class="text-xs leading-relaxed text-slate-600">Gambar ini akan dihapus dari Storage dan daftar gambar produk.</p></div><div class="dialog-foot"><button class="btn" data-close>Batal</button><button class="btn danger" id="saveExtraImage">Hapus gambar</button></div>'
  :'<form id="extraImageForm"><div class="dialog-body"><div class="field"><label for="extraImageFile">Pilih gambar</label><input id="extraImageFile" type="file" accept="image/jpeg,image/png,image/webp" required><small>JPEG, PNG, atau WebP · maksimal 5 MB.</small><div class="preview" id="extraImagePreview"></div></div></div><div class="dialog-foot"><button type="button" class="btn" data-close>Batal</button><button class="btn primary" id="saveExtraImage" type="submit">Simpan gambar</button></div></form>';
 openModal(dialogHead(title)+content,true);closeBinding();
 if(!isRemove){$("#extraImageFile").onchange=e=>previewFiles(e.target.files,"extraImagePreview",true);$("#extraImageForm").onsubmit=submit}
 else $("#saveExtraImage").onclick=submit;
 async function submit(e){if(e)e.preventDefault();const button=$("#saveExtraImage"),file=$("#extraImageFile")?.files?.[0];if(!isRemove&&!file){toast("Pilih gambar terlebih dahulu.");return}if(file&&file.size>5*1024*1024){toast("Ukuran gambar maksimal 5 MB.");return}
  button.disabled=true;button.textContent="Memproses…";
  try{const body=new FormData();body.append("id",id);body.append("additional_action",action);if(targetUrl)body.append("target_image_url",targetUrl);if(file)body.append("additional_image_link",file);await api("",{method:"PATCH",body});closeModal();toast(isRemove?"Gambar berhasil dihapus.":action==="replace"?"Gambar berhasil diganti.":"Gambar berhasil ditambahkan.");await load();openGroup(state.activeGroup)}
  catch(error){toast("Gagal mengelola gambar: "+error.message);button.disabled=false;button.textContent=isRemove?"Hapus gambar":"Simpan gambar"}
 }
}
function confirmDelete(id,key){openModal(dialogHead("Hapus varian?")+'<div class="dialog-body"><p style="font-size:12px;line-height:1.7;color:#667168">Varian ini akan dihapus permanen. Varian lain dalam kelompok <b>'+esc(key)+'</b> tidak akan ikut terhapus.</p></div><div class="dialog-foot"><button class="btn" data-close>Batal</button><button class="btn danger" id="confirmDelete">Hapus varian</button></div>',true);closeBinding();$("#confirmDelete").onclick=async()=>{const b=$("#confirmDelete");b.disabled=true;b.textContent="Menghapus…";try{await api("?id="+encodeURIComponent(id),{method:"DELETE"});closeModal();toast("Varian berhasil dihapus.");await load();if(groupRecords().some(g=>g.key===key))openGroup(key);else setPage("products")}catch(e){toast("Gagal menghapus: "+e.message);b.disabled=false;b.textContent="Hapus varian"}}}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
$("#mobileAdd").onclick=()=>openProductForm();$("#refreshBtn").onclick=load;
load();
})();
</script>
</body>
</html>
