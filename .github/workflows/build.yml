name: Frontend Build and Browser Tests

on:
  push:
    branches: ["feat/responsive-layout-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: test -f dist/404.html
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
